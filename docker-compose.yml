services:
  # ─────────────────────────────────────────────
  # EcoRecon AI — FastAPI Application
  # ─────────────────────────────────────────────
  ecorecon-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ecorecon-api
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Persist SQLite database across container restarts
      - ./ecorecon.db:/app/ecorecon.db
      # Persist ChromaDB vector store
      - ./data/chroma_db:/app/data/chroma_db
      # Mount compliance docs for ingestion scripts
      - ./data/compliance_docs:/app/data/compliance_docs
      # Mount ERP feed
      - ./data/erp:/app/data/erp
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: "0.0.0.0"
      APP_PORT: "8000"
      # Route LLM/embedding vectorizer requests through Ollama service container
      OLLAMA_BASE_URL: "http://ollama:11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      - ollama
    networks:
      - ecorecon-net

  # ─────────────────────────────────────────────
  # EcoRecon AI — Streamlit Frontend Dashboard
  # ─────────────────────────────────────────────
  ecorecon-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: ecorecon-frontend
    ports:
      - "8501:8501"
    volumes:
      # Mount frontend directories for live updates if in development
      - ./frontend:/app/frontend
      - ./.streamlit:/app/.streamlit
    env_file:
      - .env
    environment:
      # Point to backend FastAPI service container on internal bridge network
      BACKEND_API_URL: "http://ecorecon-api:8000/api/v1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      ecorecon-api:
        condition: service_healthy
    networks:
      - ecorecon-net

  # ─────────────────────────────────────────────
  # Ollama — Local Embedding Service
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ecorecon-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    networks:
      - ecorecon-net
    # Pull the embedding model on first startup
    entrypoint: >
      sh -c "ollama serve & sleep 5 && ollama pull nomic-embed-text && wait"

# ─────────────────────────────────────────────
# Volumes & Networks
# ─────────────────────────────────────────────
volumes:
  ollama-models:
    driver: local

networks:
  ecorecon-net:
    driver: bridge
