[project]
name = "ecorecon-ai"
version = "1.0.0"
description = "EcoRecon AI — Deterministic-first EPR compliance and reconciliation platform for GreenPack Industries"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
    # --- Web Framework ---
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # --- Data Validation ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # --- Database ---
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
    # --- AI Stack ---
    "langchain>=0.3.0",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.1.0",
    "langgraph>=0.2.0",
    # --- Embeddings & Vector Store ---
    "chromadb>=0.5.0",
    "onnxruntime>=1.16.0",
    "langchain-chroma>=0.1.0",
    # --- Data Processing ---
    "pandas>=2.2.0",
    # --- Environment & Config ---
    "python-dotenv>=1.0.0",
    "streamlit>=1.57.0",
    "langchain-ollama>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "deepeval>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evaluation"]

[tool.ruff]
line-length = 100
target-version = "py310"
